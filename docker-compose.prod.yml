# Production : docker compose -f docker-compose.prod.yml up -d --build (réglages dans .env).
# Le front (APP_PORT) et l'API (API_PORT) ne sont publiés que sur la machine : le Nginx de l'hôte les expose
# en HTTPS sur leurs domaines. La base n'est joignable que sur le réseau interne.
name: ndadiee-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant dans .env}
      POSTGRES_USER: ${DB_USER:?DB_USER manquant dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m
    networks:
      - ndadiee

  backend:
    build: ./backend
    image: ndadiee-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Le schéma vient des entités ; « update » le conserve d'un redémarrage à l'autre, avec les données
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Derrière Nginx : les adresses générées suivent l'hôte et le port publics
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL manquant dans .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD manquant dans .env}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?SEED_DEMO_PASSWORD manquant dans .env}
      SEED_TEST_ACCOUNT_PASSWORD: ${SEED_TEST_ACCOUNT_PASSWORD:?SEED_TEST_ACCOUNT_PASSWORD manquant dans .env}
      # Les images des membres vont dans le bucket : l'application refuse de démarrer sans ces réglages
      STORAGE_PROVIDER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID manquant dans .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID manquant dans .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY manquant dans .env}
      R2_BUCKET: ${R2_BUCKET:?R2_BUCKET manquant dans .env}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:?R2_PUBLIC_URL manquant dans .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    ports:
      - "127.0.0.1:${API_PORT:?API_PORT manquant dans .env}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/projects/facets"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: 1g
    networks:
      - ndadiee

  frontend:
    build:
      context: ./frontend
      args:
        # Fixée à la compilation : l'adresse publique de l'API, contexte /api compris
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:?VITE_BACKEND_URL manquant dans .env}
    image: ndadiee-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT manquant dans .env}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m
    networks:
      - ndadiee

volumes:
  postgres_data:

networks:
  ndadiee:
    driver: bridge
