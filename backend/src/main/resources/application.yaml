spring:
  application:
    name: ndadiee
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ndadiee}
    username: ${SPRING_DATASOURCE_USERNAME:ndadiee}
    password: ${SPRING_DATASOURCE_PASSWORD:ndadiee}
  jpa:
    hibernate:
      # Le schéma appartient à Flyway (db/migration) : Hibernate se contente de le vérifier.
      # ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Charge les relations LAZY par lots (évite le N+1 sur les listes)
        default_batch_fetch_size: 50
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
  servlet:
    multipart:
      # Au-delà, la requête n'est pas lue ; en deçà, l'application applique sa propre limite (ndadiee.storage)
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

server:
  servlet:
    context-path: /api
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

jwt:
  # Valeur de développement uniquement : définir JWT_SECRET (Base64, 256 bits minimum) en production.
  secret: ${JWT_SECRET:bGFrYS1kZXYtb25seS1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMDEyMzQ1Njc4OQ==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:30d}

ndadiee:
  seed:
    # Données de démonstration, créées au démarrage si la base est vide.
    enabled: ${SEED_ENABLED:true}
    # Mot de passe des comptes de démonstration : à changer avant toute mise en ligne.
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@Ndadiee2026}
    demo-password: ${SEED_DEMO_PASSWORD:Ndadiee@2026}
    # Mot de passe des comptes d'essai Ada et Musa, réservé au développement.
    test-account-password: ${SEED_TEST_ACCOUNT_PASSWORD:passer@123}
  storage:
    # Images du forum. auto : Cloudflare R2 dès que ses réglages ci-dessous sont complets, le disque sinon
    # (développement, servi sous /api/uploads) ; local ; r2 (l'application refuse de démarrer sans ses réglages).
    provider: ${STORAGE_PROVIDER:auto}
    local-directory: ${STORAGE_LOCAL_DIRECTORY:uploads}
    max-image-size: ${STORAGE_MAX_IMAGE_SIZE:5MB}
    max-uploads-per-hour: ${STORAGE_MAX_UPLOADS_PER_HOUR:40}
    r2:
      # Tableau de bord Cloudflare : R2 > Gérer les jetons d'API (lecture et écriture sur le bucket)
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      # Adresse publique des fichiers : le domaine relié au bucket (https://media.exemple.com) ou son adresse r2.dev
      public-url: ${R2_PUBLIC_URL:}
      # Seulement si l'API n'est pas https://<compte>.r2.cloudflarestorage.com (juridiction UE : .eu.r2…)
      endpoint: ${R2_ENDPOINT:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
