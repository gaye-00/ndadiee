spring:
  application:
    name: ndadiee
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/ndadiee}
    username: ${SPRING_DATASOURCE_USERNAME:ndadiee}
    password: ${SPRING_DATASOURCE_PASSWORD:ndadiee}
  flyway:
    enabled: true
  jpa:
    hibernate:
      # Flyway gère le schéma ; Hibernate ne le modifie dans aucun profil.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Charge les relations LAZY par lots (évite le N+1 sur les listes)
        default_batch_fetch_size: 50
  servlet:
    multipart:
      # Au-delà, la requête n'est pas lue ; en deçà, l'application applique sa propre limite (ndadiee.storage)
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

server:
  servlet:
    context-path: /api
  port: ${SERVER_PORT:8080}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

jwt:
  # Obligatoire dans chaque environnement ; JwtService valide le format et la taille au démarrage.
  secret: ${JWT_SECRET:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:30d}

ndadiee:
  seed:
    # Désactivé par défaut dans tous les profils ; l'activation doit être explicite.
    enabled: ${SEED_ENABLED:false}
    # Les mots de passe ne possèdent aucun défaut ; requis seulement si les seeders sont activés.
    admin-password: ${SEED_ADMIN_PASSWORD:}
    demo-password: ${SEED_DEMO_PASSWORD:}
    test-account-password: ${SEED_TEST_ACCOUNT_PASSWORD:}
  storage:
    # Images du forum et des projets. auto : Cloudflare R2 dès que ses réglages ci-dessous sont complets, le disque sinon
    # (développement, servi sous /api/uploads) ; local ; r2 (l'application refuse de démarrer sans ses réglages).
    provider: ${STORAGE_PROVIDER:auto}
    local-directory: ${STORAGE_LOCAL_DIRECTORY:uploads}
    max-image-size: ${STORAGE_MAX_IMAGE_SIZE:5MB}
    max-uploads-per-hour: ${STORAGE_MAX_UPLOADS_PER_HOUR:40}
    # Une image de projet que rien ne montre (brouillon jamais publié, couverture remplacée, projet supprimé) est
    # supprimée après ce délai. Le ménage passe toutes les heures (MediaUploadService).
    orphan-retention: ${STORAGE_ORPHAN_RETENTION:7d}
    r2:
      # Tableau de bord Cloudflare : R2 > Gérer les jetons d'API (lecture et écriture sur le bucket)
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      # Adresse publique des fichiers : le domaine relié au bucket (https://media.exemple.com) ou son adresse r2.dev
      public-url: ${R2_PUBLIC_URL:}
      # Seulement si l'API n'est pas https://<compte>.r2.cloudflarestorage.com (juridiction UE : .eu.r2…)
      endpoint: ${R2_ENDPOINT:}

  mail:
    # E-mails de notification des revues de code (un commentaire, un verdict, une revue jugée utile). Coupés ici :
    # seul le profil prod les envoie (application-prod.yaml, serveur SMTP). Hors production, chaque e-mail qui serait
    # parti est seulement noté dans le journal.
    enabled: false
    # L'expéditeur : le serveur SMTP n'accepte que l'adresse du compte qui s'y connecte
    from: ${MAIL_FROM:Ndadiee <${MAIL_USERNAME:no-reply@hautetech.org}>}

  github:
    # Import d'un dépôt public dans le formulaire de projet, et pull requests des projets. Sans jeton, GitHub accepte
    # 60 requêtes par heure pour tout le serveur (trois par import) et refuse l'API GraphQL : les PR ne sont pas lues.
    # Avec un jeton, 5 000. github.com > Settings > Developer settings > Fine-grained tokens : accès aux dépôts publics
    # seulement, aucune permission.
    token: ${GITHUB_TOKEN:}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    sync:
      # Les PR de chaque projet à dépôt GitHub, relues toutes les 10 minutes (PullRequestSyncService)
      enabled: ${GITHUB_SYNC_ENABLED:true}
      interval: ${GITHUB_SYNC_INTERVAL:10m}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
