# Code review notification e-mails (ReviewMailComposer), in English.
# {0}: who acted; {1}: pull request number; {2}: reputation earned; {3}: project.
# Typographic apostrophes (’): a straight one would be swallowed by message formatting.

mail.greeting=Hi {0},
mail.cta=View the review
mail.ctaLine=View the commented line
mail.manage=Manage my e-mails
mail.brand=Ndadiee · code, reviewed together
mail.location={0} · line {1}
mail.suggestion=Suggestion
mail.reason.AUTHOR=You’re receiving this e-mail because you opened this pull request.
mail.reason.PARTICIPANT=You’re receiving this e-mail because you wrote in this discussion.
mail.reason.REVIEWER=You’re receiving this e-mail because you reviewed this pull request.

mail.verdict.APPROVED=Approved
mail.verdict.CHANGES_REQUESTED=Changes requested
mail.verdict.COMMENTED=Commented

COMMENTED.AUTHOR.subject={0} commented on your pull request #{1}
COMMENTED.AUTHOR.headline={0} commented on your pull request
COMMENTED.PARTICIPANT.subject={0} replied in a discussion on #{1}
COMMENTED.PARTICIPANT.headline={0} replied in a discussion you wrote in

REVIEWED.APPROVED.subject={0} approved your pull request #{1}
REVIEWED.APPROVED.headline={0} approved your pull request
REVIEWED.APPROVED.text=This approval counts towards merging: once all required reviews are in, merge on GitHub.
REVIEWED.CHANGES_REQUESTED.subject={0} requested changes on #{1}
REVIEWED.CHANGES_REQUESTED.headline={0} requested changes
REVIEWED.CHANGES_REQUESTED.text=Fix them in your branch on GitHub: the pull request updates itself on Ndadiee.
REVIEWED.COMMENTED.subject={0} reviewed your pull request #{1}
REVIEWED.COMMENTED.headline={0} reviewed your pull request
REVIEWED.COMMENTED.text=Some remarks, no verdict yet.

CLAIMED.subject={0} volunteered to review your pull request #{1}
CLAIMED.headline={0} volunteered to review your pull request
CLAIMED.text=Their review will land in the pull request conversation.

JUDGED_HELPFUL.subject=Your review of #{1} was marked helpful: +{2} reputation
JUDGED_HELPFUL.headline=The {3} team marked your review helpful
JUDGED_HELPFUL.text=It earns you +{2} reputation. Thanks for taking the time to review the community’s code.

# The email address verification code (VerificationMailComposer). {0}: the code; {1}: how long it lasts, in minutes.
verification.subject={0} is your Ndadiee code
verification.headline=Confirm your email address
verification.intro=To finish signing up on Ndadiee, enter this code on the page that asked for it.
verification.validity=It is valid for {1} minutes, and works only once.
verification.ignore=Didn’t sign up? Ignore this email: without this code, no account is opened.

# The code to choose a new password (forgotten password). {0}: the code; {1}: how long it lasts, in minutes.
reset.subject={0} is your code to change your password
reset.headline=Choose a new password
reset.intro=You asked to change the password of your Ndadiee account. Enter this code on the page that asked for it.
reset.validity=It is valid for {1} minutes, and works only once.
reset.ignore=Didn’t ask for anything? Ignore this email: without this code, your password stays the same.

# The code that confirms the deletion of an account without a password (GitHub, Google).
deletion.subject={0} is your code to delete your Ndadiee account
deletion.headline=Confirm the deletion of your account
deletion.intro=You asked to delete your Ndadiee account. Enter this code in your settings to confirm.
deletion.validity=It is valid for {1} minutes, and works only once.
deletion.ignore=Didn’t ask for anything? Ignore this email: without this code, your account stays open.

# Account security notices (AccountNoticeComposer). {0}: the date announced.
passwordChanged.subject=Your Ndadiee password has changed
passwordChanged.headline=Your password has changed
passwordChanged.intro=The password of your Ndadiee account has just been changed. Your other sessions have been signed out.
passwordChanged.cta=Wasn’t you? Choose a new one
passwordChanged.footnote=If it was you, there is nothing to do.

deletionScheduled.subject=Your Ndadiee account will be deleted on {0}
deletionScheduled.headline=Your account is scheduled for deletion
deletionScheduled.intro=Your account and your personal data will be erased on {0}. Until then, simply sign in again to cancel everything.
deletionScheduled.cta=Sign in and cancel
deletionScheduled.footnote=Didn’t ask for this? Sign in right away, then change your password.

accountDeleted.subject=Your Ndadiee account has been deleted
accountDeleted.headline=Your account has been deleted
accountDeleted.intro=As you asked, your account and your personal data have been erased. Your public contributions remain, signed “Deleted account”.
accountDeleted.footnote=Thank you for being part of the workshop. You are welcome back anytime, with the same address.
