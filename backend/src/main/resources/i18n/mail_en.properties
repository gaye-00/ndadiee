JUDGED_HELPFUL.subject=Your review of #{1} was marked helpful: +{2} reputation
JUDGED_HELPFUL.headline=The {3} team marked your review helpful
JUDGED_HELPFUL.text=It earns you +{2} reputation. Thanks for taking the time to review the community’s code.
