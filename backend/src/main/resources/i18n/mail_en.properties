REVIEWED.COMMENTED.subject={0} reviewed your pull request #{1}
REVIEWED.COMMENTED.headline={0} reviewed your pull request
REVIEWED.COMMENTED.text=Some remarks, no verdict yet.

CLAIMED.subject={0} volunteered to review your pull request #{1}
CLAIMED.headline={0} volunteered to review your pull request
