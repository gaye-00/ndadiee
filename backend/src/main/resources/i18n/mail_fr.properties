# Les e-mails de notification des revues de code (ReviewMailComposer), en français.
# {0} : qui a fait le geste ; {1} : numéro de la PR ; {2} : réputation gagnée ; {3} : projet.
# Apostrophes typographiques (’) : une apostrophe droite serait avalée par le formatage des messages.

mail.greeting=Bonjour {0},
mail.cta=Voir la revue
mail.ctaLine=Voir la ligne commentée
mail.manage=Gérer mes e-mails
mail.brand=Ndadiee · le code, relu ensemble
mail.location={0} · ligne {1}
mail.suggestion=Suggestion
mail.reason.AUTHOR=Tu reçois cet e-mail parce que tu as ouvert cette pull request.
mail.reason.PARTICIPANT=Tu reçois cet e-mail parce que tu as écrit dans cette discussion.
mail.reason.REVIEWER=Tu reçois cet e-mail parce que tu as relu cette pull request.

mail.verdict.APPROVED=Approuvée
mail.verdict.CHANGES_REQUESTED=Changements demandés
mail.verdict.COMMENTED=Commentée

COMMENTED.AUTHOR.subject={0} a commenté ta pull request #{1}
COMMENTED.AUTHOR.headline={0} a commenté ta pull request
COMMENTED.PARTICIPANT.subject={0} a répondu dans une discussion de #{1}
COMMENTED.PARTICIPANT.headline={0} a répondu dans une discussion où tu as écrit

REVIEWED.APPROVED.subject={0} a approuvé ta pull request #{1}
REVIEWED.APPROVED.headline={0} a approuvé ta pull request
REVIEWED.APPROVED.text=Son approbation compte pour la fusion : quand toutes les revues requises sont là, fusionne sur GitHub.
REVIEWED.CHANGES_REQUESTED.subject={0} demande des changements sur #{1}
REVIEWED.CHANGES_REQUESTED.headline={0} demande des changements
REVIEWED.CHANGES_REQUESTED.text=Corrige dans ta branche sur GitHub : la pull request se met à jour toute seule sur Ndadiee.
REVIEWED.COMMENTED.subject={0} a relu ta pull request #{1}
REVIEWED.COMMENTED.headline={0} a relu ta pull request
REVIEWED.COMMENTED.text=Des remarques, sans verdict pour l’instant.

CLAIMED.subject={0} se propose pour relire ta pull request #{1}
CLAIMED.headline={0} se propose pour relire ta pull request
CLAIMED.text=Sa revue arrivera dans la conversation de la pull request.

JUDGED_HELPFUL.subject=Ta revue de #{1} a été jugée utile : +{2} de réputation
JUDGED_HELPFUL.headline=L’équipe de {3} a jugé ta revue utile
JUDGED_HELPFUL.text=Elle te rapporte +{2} de réputation. Merci d’avoir pris le temps de relire le code de la communauté.
