# Les e-mails de notification des revues de code (ReviewMailComposer), en français.
# {0} : qui a fait le geste ; {1} : numéro de la PR ; {2} : réputation gagnée ; {3} : projet.
# Apostrophes typographiques (’) : une apostrophe droite serait avalée par le formatage des messages.

mail.greeting=Bonjour {0},
mail.cta=Voir la revue
mail.ctaLine=Voir la ligne commentée
mail.manage=Gérer mes e-mails
mail.brand=Ndadiee · le code, relu ensemble
mail.location={0} · ligne {1}
mail.suggestion=Suggestion
mail.reason.AUTHOR=Tu reçois cet e-mail parce que tu as ouvert cette pull request.
mail.reason.PARTICIPANT=Tu reçois cet e-mail parce que tu as écrit dans cette discussion.
mail.reason.REVIEWER=Tu reçois cet e-mail parce que tu as relu cette pull request.

mail.verdict.APPROVED=Approuvée
mail.verdict.CHANGES_REQUESTED=Changements demandés
mail.verdict.COMMENTED=Commentée

COMMENTED.AUTHOR.subject={0} a commenté ta pull request #{1}
COMMENTED.AUTHOR.headline={0} a commenté ta pull request
COMMENTED.PARTICIPANT.subject={0} a répondu dans une discussion de #{1}
COMMENTED.PARTICIPANT.headline={0} a répondu dans une discussion où tu as écrit

REVIEWED.APPROVED.subject={0} a approuvé ta pull request #{1}
REVIEWED.APPROVED.headline={0} a approuvé ta pull request
REVIEWED.APPROVED.text=Son approbation compte pour la fusion : quand toutes les revues requises sont là, fusionne sur GitHub.
REVIEWED.CHANGES_REQUESTED.subject={0} demande des changements sur #{1}
REVIEWED.CHANGES_REQUESTED.headline={0} demande des changements
REVIEWED.CHANGES_REQUESTED.text=Corrige dans ta branche sur GitHub : la pull request se met à jour toute seule sur Ndadiee.
REVIEWED.COMMENTED.subject={0} a relu ta pull request #{1}
REVIEWED.COMMENTED.headline={0} a relu ta pull request
REVIEWED.COMMENTED.text=Des remarques, sans verdict pour l’instant.

CLAIMED.subject={0} se propose pour relire ta pull request #{1}
CLAIMED.headline={0} se propose pour relire ta pull request
CLAIMED.text=Sa revue arrivera dans la conversation de la pull request.

JUDGED_HELPFUL.subject=Ta revue de #{1} a été jugée utile : +{2} de réputation
JUDGED_HELPFUL.headline=L’équipe de {3} a jugé ta revue utile
JUDGED_HELPFUL.text=Elle te rapporte +{2} de réputation. Merci d’avoir pris le temps de relire le code de la communauté.

# Le code de vérification de l'adresse e-mail (VerificationMailComposer). {0} : le code ; {1} : sa durée en minutes.
verification.subject={0} est ton code Ndadiee
verification.headline=Confirme ton adresse e-mail
verification.intro=Pour terminer ton inscription sur Ndadiee, saisis ce code sur la page qui te l’a demandé.
verification.validity=Il est valable {1} minutes, et ne sert qu’une fois.
verification.ignore=Tu n’es pas à l’origine de cette inscription ? Ignore cet e-mail : sans ce code, aucun compte ne s’ouvre.

# Le code pour choisir un nouveau mot de passe (mot de passe oublié). {0} : le code ; {1} : sa durée en minutes.
reset.subject={0} est ton code pour changer de mot de passe
reset.headline=Choisis un nouveau mot de passe
reset.intro=Tu as demandé à changer le mot de passe de ton compte Ndadiee. Saisis ce code sur la page qui te l’a demandé.
reset.validity=Il est valable {1} minutes, et ne sert qu’une fois.
reset.ignore=Tu n’as rien demandé ? Ignore cet e-mail : sans ce code, ton mot de passe ne change pas.

# Le code qui confirme la suppression d'un compte sans mot de passe (GitHub, Google).
deletion.subject={0} est ton code pour supprimer ton compte Ndadiee
deletion.headline=Confirme la suppression de ton compte
deletion.intro=Tu as demandé la suppression de ton compte Ndadiee. Saisis ce code dans tes réglages pour la confirmer.
deletion.validity=Il est valable {1} minutes, et ne sert qu’une fois.
deletion.ignore=Tu n’as rien demandé ? Ignore cet e-mail : sans ce code, ton compte reste ouvert.

# Les avis de sécurité du compte (AccountNoticeComposer). {0} : la date annoncée.
passwordChanged.subject=Ton mot de passe Ndadiee a changé
passwordChanged.headline=Ton mot de passe a changé
passwordChanged.intro=Le mot de passe de ton compte Ndadiee vient d’être modifié. Tes autres sessions ont été fermées.
passwordChanged.cta=Ce n’était pas toi ? Choisis-en un nouveau
passwordChanged.footnote=Si c’est bien toi, tu n’as rien à faire.

deletionScheduled.subject=Ton compte Ndadiee sera supprimé le {0}
deletionScheduled.headline=La suppression de ton compte est programmée
deletionScheduled.intro=Ton compte et tes données personnelles seront effacés le {0}. D’ici là, il suffit de te reconnecter pour tout annuler.
deletionScheduled.cta=Me reconnecter et annuler
deletionScheduled.footnote=Tu n’as rien demandé ? Reconnecte-toi tout de suite, puis change ton mot de passe.

accountDeleted.subject=Ton compte Ndadiee a été supprimé
accountDeleted.headline=Ton compte a été supprimé
accountDeleted.intro=Comme tu l’as demandé, ton compte et tes données personnelles ont été effacés. Tes contributions publiques restent, signées « Compte supprimé ».
accountDeleted.footnote=Merci d’avoir fait partie de l’atelier. Tu peux revenir quand tu veux, avec la même adresse.
