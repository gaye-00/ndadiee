<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080d" />
    <title>Ndadiee — Trouve ton équipe. Livre ton projet.</title>
    <meta
      name="description"
      content="La plateforme des devs du continent : une vitrine pour montrer ce que tu construis, des annonces avec les rôles recherchés et un espace d'équipe avec kanban et revues de code."
    />

    <!--
      Aperçu d'un lien partagé (WhatsApp, Facebook, LinkedIn, X, Slack, Discord…). Les robots de ces sites
      n'exécutent pas le JavaScript : ils ne lisent que ces balises, les mêmes pour toutes les pages.
      Adresses absolues obligatoires. L'image (public/og-image.png) fait 1200 × 630 px et moins de 300 Ko pour WhatsApp.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ndadiee" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://ndadiee.com/" />
    <meta property="og:title" content="Ndadiee — Trouve ton équipe. Livre ton projet." />
    <meta
      property="og:description"
      content="La plateforme des devs du continent : une vitrine pour montrer ce que tu construis, des annonces avec les rôles recherchés et un espace d'équipe avec kanban et revues de code."
    />
    <meta property="og:image" content="https://ndadiee.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ndadiee : Trouve ton équipe. Livre ton projet." />
    <!-- X reprend le titre, la description et l'image d'Open Graph ; il ne lui faut que le format de la carte -->
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Réglages appliqués avant le premier rendu, pour qu'aucun flash ne soit visible :
      thème clair ou sombre, langue et sens d'écriture, mode économie de données.
      Mêmes clés et mêmes règles que src/utils/storage.ts, src/store/ et src/i18n/languages.ts.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem("ndadiee_theme");
          var dark =
            theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = dark ? "#07080d" : "#f5f5f2";

          // Langue : choix enregistré, sinon première langue du navigateur que l'on traduit, sinon français
          var languages = ["fr", "en", "ar", "pt", "am", "ha", "sw", "wo", "yo", "zu"];
          var lang = localStorage.getItem("ndadiee_lang");
          if (languages.indexOf(lang) < 0) {
            lang = "fr";
            var preferred = navigator.languages || [navigator.language];
            for (var i = 0; i < preferred.length; i++) {
              var code = String(preferred[i]).toLowerCase().split("-")[0];
              if (languages.indexOf(code) >= 0) {
                lang = code;
                break;
              }
            }
          }
          root.lang = lang;
          root.dir = lang === "ar" ? "rtl" : "ltr";

          var saver = localStorage.getItem("ndadiee_data_saver");
          var browserSaves =
            (navigator.connection && navigator.connection.saveData) ||
            window.matchMedia("(prefers-reduced-data: reduce)").matches;
          if (saver === "on" || (saver === null && browserSaves)) {
            root.setAttribute("data-saver", "");
          }
        } catch (e) {
          // Stockage bloqué (navigation privée stricte) : valeurs par défaut
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Loader affiché pendant que le JavaScript arrive (connexion lente) : les points de
        src/components/feedback/PageLoader.tsx, en HTML pur. React le remplace par celui-là au premier
        affichage, traduit pour les lecteurs d'écran ; même dessin, même horloge, sans à-coup.
      -->
      <div class="page-loader" aria-hidden="true">
        <span class="pulsating-dots"
          ><span class="pulsating-dot"></span><span class="pulsating-dot"></span><span class="pulsating-dot"></span
        ></span>
      </div>
    </div>
    <script>
      // Animations du loader calées sur l'ouverture de la page, comme src/lib/pageClock.ts. Le navigateur
      // ne lance ce script qu'une fois la feuille de style chargée : les animations existent déjà.
      try {
        document
          .querySelector("#root .page-loader")
          .getAnimations({ subtree: true })
          .forEach(function (animation) {
            animation.startTime = 0;
          });
      } catch (e) {
        // Navigateur ancien : le loader s'anime quand même, à partir de son apparition
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
