<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ndadiee — La communauté des développeurs africains</title>
    <meta
      name="description"
      content="Ndadiee, la plateforme d'échange pour les devs, par les devs : questions et réponses, articles, projets open source et opportunités à travers l'Afrique."
    />

    <!-- Évite le flash de thème : applique la classe dark avant le premier rendu.
         Même clé et même règle que src/store/useThemeStore.ts -->
    <script>
      (function () {
        var saved = localStorage.getItem("ndadiee_theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
