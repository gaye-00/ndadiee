# En-têtes transmis à l'API. Inclus dans chaque location : un proxy_set_header posé dans une location annule tous ceux
# hérités du bloc server.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# L'hôte avec son port : les adresses des images renvoyées par l'API doivent garder le port public
proxy_set_header X-Forwarded-Host $http_host;
