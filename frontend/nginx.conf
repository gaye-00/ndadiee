# Le front et l'API derrière une seule adresse : le navigateur ne parle qu'à ce serveur.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Le protocole annoncé par un éventuel proxy HTTPS placé devant (le futur domaine), sinon celui de cette connexion
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le DNS de Docker : l'adresse du backend est relue quand son conteneur est recréé
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # Un peu au-dessus de la limite de l'API (10 Mo), pour que ce soit elle qui réponde à un fichier trop gros
    client_max_body_size 11m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Le WebSocket de la messagerie
    location = /api/ws {
        proxy_pass $backend;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Les fichiers compilés portent une empreinte dans leur nom : ils ne changent jamais
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # L'application : toute adresse inconnue revient à index.html, le routeur du navigateur s'en charge
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
